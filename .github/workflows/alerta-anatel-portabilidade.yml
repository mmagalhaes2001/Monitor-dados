name: Alerta - portabilidade Anatel (arquivo)

# Avisa (push no app ntfy, mesmo tópico da Anatel) quando a Anatel publica a base nova de
# portabilidade numérica: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/portabilidade/portabilidade.zip
# (conjunto "portabilidade-numerica" em dados.gov.br).
#
# Como detecta: lê só o cabeçalho "Last-Modified" do zip. Quando muda, baixa o zip (~8 MB) e vê o
# último mês e o total de portabilidades móveis (SMP).
#  - Mês novo  -> push urgente "portabilidade de MM/AA saiu" com o número do mês.
#  - Mesmo mês -> push normal "base de portabilidade republicada".
#
# Frequência: do dia 1 ao 15 (horário de Brasília) checa a cada 2 min, em "corrente"
# (~5h50 por execução, depois dispara a próxima). Fora dessa janela, só o cron (a cada 30 min,
# uma checagem por execução), para não perder uma publicação fora do período usual.
# Estado em estado/anatel-portabilidade.env.
on:
  schedule:
    - cron: "20,50 * * * *"
  push:
    paths:
      - ".github/workflows/alerta-anatel-portabilidade.yml"
      - "anatel/portabilidade.py"
  workflow_dispatch:
    inputs:
      teste:
        description: "Teste: uma checagem só, lê a base e manda push de teste"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: alerta-anatel-portabilidade
  cancel-in-progress: false

env:
  NTFY_TOPIC: mm-anatel-1972ee28a387
  ZIP_URL: https://www.anatel.gov.br/dadosabertos/paineis_de_dados/portabilidade/portabilidade.zip
  LINK: https://dados.gov.br/dados/conjuntos-dados/portabilidade-numerica
  INTERVALO: "120"
  DURACAO: "21000"
  DIA_FIM: "15"

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - name: Modo
        id: modo
        env:
          TESTE: ${{ inputs.teste || github.event_name == 'push' }}
        run: |
          d=$(TZ=America/Sao_Paulo date +%-d)
          if [ "$TESTE" = "true" ]; then echo "modo=teste" >> $GITHUB_OUTPUT
          elif [ "$d" -le "$DIA_FIM" ]; then echo "modo=loop" >> $GITHUB_OUTPUT
          else echo "modo=unica" >> $GITHUB_OUTPUT; fi

      - name: Checar
        id: loop
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          mkdir -p estado; touch estado/anatel-portabilidade.env; source estado/anatel-portabilidade.env
          [ "$MODO" != "loop" ] && DURACAO=1
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          push() { # titulo, prioridade, tags, mensagem
            for t in 1 2 3; do
              if curl -sSf -m 20 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -H "Click: $LINK" \
                   ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
                   --data-binary "$4" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null; then return 0; fi
              sleep 20
            done
            echo "falha no ntfy: $1"
            if [ "$2" != "low" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$1" --body "$4 ($LINK)" || echo "falha na issue"
            fi
          }
          salvar() {
            printf 'LM_VISTO="%s"\nMES_VISTO="%s"\n' "$LM_VISTO" "$MES_VISTO" > estado/anatel-portabilidade.env
            git add estado/anatel-portabilidade.env
            git commit -q -m "Portabilidade Anatel: $1" || true
            git pull --rebase -q || true
            git push -q || echo "falha ao salvar"
          }
          pct() { python3 -c "a,b=$1,$2;print(f'{(b/a-1)*100:+.1f}%'.replace('.',',') if a else 'n/d')"; }
          fmt() { python3 -c "print(f'{$1:,}'.replace(',','.'))"; }

          fim=$(( $(date +%s) + DURACAO )); falha_desde=""; avisou_falha=""
          while :; do
            agora=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')
            if [ "$MODO" = "loop" ] && [ "$(TZ=America/Sao_Paulo date +%-d)" -gt "$DIA_FIM" ]; then
              echo "$agora fim da janela."; break
            fi
            lm=$(curl -sS -I -m 30 -A "Mozilla/5.0" "$ZIP_URL" 2>/dev/null | tr -d '\r' | grep -i '^last-modified:' | cut -d' ' -f2-)
            if [ -z "$lm" ]; then
              echo "$agora sem resposta"
              [ -z "$falha_desde" ] && falha_desde=$(date +%s)
              if [ -z "$avisou_falha" ] && [ $(( $(date +%s) - falha_desde )) -gt 3600 ]; then
                push "Portabilidade Anatel: arquivo fora do ar" default warning "Há mais de 1h sem resposta do arquivo ($agora). Sigo tentando."
                avisou_falha=1
              fi
            else
              falha_desde=""; avisou_falha=""
              if [ "$MODO" = "teste" ] || [ "$lm" != "$LM_VISTO" ]; then
                echo "$agora Last-Modified: $lm (antes: ${LM_VISTO:-nenhum})"
                if curl -sSf -m 300 -A "Mozilla/5.0" -o port.zip "$ZIP_URL" && r=$(python3 anatel/portabilidade.py port.zip); then
                  echo "$r"
                  mes=$(echo "$r" | python3 -c "import sys,json;print(json.load(sys.stdin)['mes'])")
                  ref=$(date -d "$mes-01" '+%m/%y')
                  smp=$(echo "$r" | python3 -c "import sys,json;print(json.load(sys.stdin)['smp'])")
                  mm=$(echo "$r" | python3 -c "import sys,json;print(json.load(sys.stdin)['smp_mes_anterior'] or 0)")
                  aa=$(echo "$r" | python3 -c "import sys,json;print(json.load(sys.stdin)['smp_ano_anterior'] or 0)")
                  lm_br=$(TZ=America/Sao_Paulo date -d "$lm" '+%d/%m %H:%M')
                  msg="Portabilidades móveis em $ref: $(fmt $smp) ($(pct $mm $smp) m/m, $(pct $aa $smp) a/a). Arquivo de $lm_br."
                  if [ "$MODO" = "teste" ]; then
                    push "Teste portabilidade Anatel" high test_tube "Leitura ok. $msg"
                  elif [ -z "$LM_VISTO" ]; then
                    echo "Primeira leitura, guardada como referência."
                  elif [ "$mes" != "$MES_VISTO" ]; then
                    push "Anatel: portabilidade de $ref saiu" urgent rotating_light "$msg"
                  else
                    push "Anatel: base de portabilidade republicada ($ref)" default memo "Mesmo último mês, arquivo novo. $msg"
                  fi
                  if [ "$MODO" != "teste" ]; then LM_VISTO="$lm"; MES_VISTO="$mes"; salvar "$ref ($lm)"; fi
                else
                  echo "$agora falha ao baixar/ler o zip; tento de novo na próxima."
                fi
              fi
            fi
            [ "$(date +%s)" -ge "$fim" ] && break
            sleep "$INTERVALO"
          done

      - name: Disparar o próximo turno
        if: steps.modo.outputs.modo == 'loop' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          d=$(TZ=America/Sao_Paulo date +%-d)
          if [ "$d" -le "$DIA_FIM" ]; then
            gh workflow run alerta-anatel-portabilidade.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
