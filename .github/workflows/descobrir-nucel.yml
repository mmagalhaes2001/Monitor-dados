name: Teste - descoberta NuCel (uso único)
on:
  push:
    paths: [".github/workflows/descobrir-nucel.yml", "planos/descobrir_nucel.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
      - run: python planos/descobrir_nucel.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch -q origin main && git reset -q --soft origin/main
          git add planos/descoberta_nucel && git commit -qm "Descoberta NuCel [skip ci]" && git push -q origin HEAD:main || true
