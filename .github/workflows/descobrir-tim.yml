name: Teste - descoberta TIM fibra (uso único)
on:
  push:
    paths: [".github/workflows/descobrir-tim.yml", "planos/descobrir_tim.py"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q playwright==1.48.0 beautifulsoup4==4.12.3 lxml==5.3.0
          python -m playwright install --with-deps chromium > /dev/null
      - run: python planos/descobrir_tim.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add planos/descoberta_tim && git commit -qm "Descoberta TIM fibra [skip ci]" && git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main || true
