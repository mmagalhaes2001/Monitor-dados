name: Alerta - CNJ painel saúde

# Acompanha o painel de saúde do CNJ (Justiça em Números, Power BI público):
# https://justica-em-numeros.cnj.jus.br/painel-saude/  - recorte Saúde Suplementar.
#
# Como lê: consulta a mesma API que o painel usa (cnj/saude_dados.py), sem navegador:
# frase "Painel atualizado em ...", cards (pendentes, tempos médios, baixados, casos novos) e
# a série mensal de casos novos e baixados desde 2020.
#
# A cada 10 min, o mês inteiro:
#  - mudou a data do painel        -> push urgente "painel atualizado" + revisões dos meses anteriores
#  - mesma data, números mudaram   -> push "números revisados"
# Em qualquer dos dois casos, guarda uma foto completa (com pendentes e tempos médios mês a mês)
# em estado/cnj-saude-sup/ e refaz a planilha resultados/cnj/cnj_saude_suplementar.xlsx.
#
# Roda em "corrente" (~5h50 por execução, depois dispara a próxima); o cron é rede de segurança.
# Toda alteração no código (push) roda uma checagem de teste e manda um push "Teste CNJ saúde".
on:
  schedule:
    - cron: "5,35 * * * *"
  push:
    paths:
      - ".github/workflows/alerta-cnj-saude.yml"
      - "cnj/**"
  workflow_dispatch:
    inputs:
      teste:
        description: "Teste: uma checagem só e manda push de teste"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: alerta-cnj-saude
  cancel-in-progress: false

env:
  NTFY_TOPIC: mm-cnj-395edfecd355
  LINK: https://justica-em-numeros.cnj.jus.br/painel-saude/
  FOTOS: estado/cnj-saude-sup
  PLANILHA: resultados/cnj/cnj_saude_suplementar.xlsx
  INTERVALO: "600"
  DURACAO: "21000"

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -q openpyxl

      - name: Checar em loop
        id: loop
        env:
          TESTE: ${{ inputs.teste || github.event_name == 'push' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          [ "$TESTE" = "true" ] && DURACAO=1
          mkdir -p "$FOTOS"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          PLAN_LINK="https://github.com/$GITHUB_REPOSITORY/raw/main/$PLANILHA"

          push() { # titulo, prioridade, tags, mensagem, link
            for t in 1 2 3; do
              if curl -sSf -m 20 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -H "Click: ${5:-$LINK}" \
                   ${NTFY_TOKEN:+-H "Authorization: Bearer $NTFY_TOKEN"} \
                   --data-binary "$4" "https://ntfy.sh/$NTFY_TOPIC" > /dev/null; then return 0; fi
              sleep 20
            done
            echo "falha no ntfy: $1"
            if [ "$2" != "low" ]; then
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$1" --body "$4 (${5:-$LINK})" || echo "falha na issue"
            fi
          }
          campo() { python -c "import json;print(json.load(open('cmp.json'))['$1'])"; }

          fim=$(( $(date +%s) + DURACAO )); ultimo_ping=""; falha_desde=""; avisou_falha=""
          while :; do
            agora=$(TZ=America/Sao_Paulo date '+%d/%m %H:%M')
            if python cnj/saude_dados.py > nova.json && python cnj/saude_compara.py nova.json "$FOTOS" > cmp.json; then
              falha_desde=""; avisou_falha=""
              ev=$(campo evento); echo "$agora evento=$ev"
              if [ "$TESTE" = "true" ]; then
                pend=$(python -c "import json;print(json.load(open('nova.json'))['cards']['pendentes'])")
                push "Teste CNJ saúde" high test_tube "Leitura ok (evento: $ev). Pendentes Saúde Suplementar: $pend. Toque para abrir a planilha." "$PLAN_LINK"
              elif [ "$ev" != "nada" ]; then
                # Foto completa (com pendentes e tempos médios mês a mês) e planilha nova
                if python cnj/saude_dados.py --historico > foto.json && python cnj/saude_compara.py foto.json "$FOTOS" > cmp.json; then
                  ev=$(campo evento)
                  dp=$(python -c "import json,re;t=json.load(open('foto.json'))['data_texto'];d=re.search(r'(\d{2})/(\d{2})/(\d{4})',t).groups();print(f'{d[2]}-{d[1]}-{d[0]}')")
                  cp foto.json "$FOTOS/${dp}_lido-$(TZ=America/Sao_Paulo date +%Y-%m-%d-%H%M).json"
                  python cnj/saude_planilha.py "$FOTOS" "$PLANILHA"
                  if [ "$ev" = "atualizacao" ]; then
                    push "$(campo titulo)" urgent rotating_light "$(campo mensagem)" "$PLAN_LINK"
                  elif [ "$ev" = "revisao" ]; then
                    push "$(campo titulo)" default memo "$(campo mensagem)" "$PLAN_LINK"
                  fi
                  git add "$FOTOS" "$PLANILHA"
                  git commit -q -m "CNJ saúde: $ev ($dp)" || true
                  git pull --rebase -q || true
                  git push -q || echo "falha ao salvar"
                else
                  echo "$agora falha na leitura completa; tento de novo na próxima."
                fi
              fi
            else
              echo "$agora falha na leitura: $(head -c 300 nova.json)"
              [ -z "$falha_desde" ] && falha_desde=$(date +%s)
              if [ -z "$avisou_falha" ] && [ $(( $(date +%s) - falha_desde )) -gt 3600 ]; then
                push "CNJ saúde: não consigo ler o painel" default warning \
                  "Há mais de 1h sem conseguir ler os dados ($agora). Pode ser fora do ar ou mudança no painel."
                avisou_falha=1
              fi
            fi

            # Aviso de vida: 9h, uma vez por dia
            hoje=$(TZ=America/Sao_Paulo date '+%d/%m'); hora=$(TZ=America/Sao_Paulo date +%H)
            if [ "$hora" = "09" ] && [ "$ultimo_ping" != "$hoje" ] && [ "$TESTE" != "true" ]; then
              n=$(curl -sS -m 20 "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=2h" | grep -c "Robô CNJ ok ($hoje)" || true)
              ult=$(ls "$FOTOS" | tail -1 | cut -c1-10)
              [ "$n" = "0" ] && push "Robô CNJ ok ($hoje)" low robot "Última publicação vista: ${ult:-?}. Sigo checando a cada 10 min (data e revisões)." "$PLAN_LINK"
              ultimo_ping=$hoje
            fi

            [ "$(date +%s)" -ge "$fim" ] && break
            sleep "$INTERVALO"
          done
          echo "Fim do turno."

      - name: Disparar o próximo turno
        if: inputs.teste != true && github.event_name != 'push' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run alerta-cnj-saude.yml --repo "$GITHUB_REPOSITORY" --ref main
