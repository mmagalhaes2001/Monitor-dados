name: Teste - planos das operadoras (descoberta)

# Teste do monitor de planos de celular/fibra (Vivo, Claro, TIM).
# Abre as páginas de planos com navegador e guarda HTML, print e respostas JSON como artefato
# (aba Actions > execução > Artifacts). Não manda aviso nem grava nada no repositório.
on:
  push:
    paths:
      - ".github/workflows/teste-planos.yml"
      - "planos/descobrir*.py"
  workflow_dispatch:
    inputs:
      alvos:
        description: "Alvos separados por espaço (vazio = todos)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
      - name: Abrir os sites
        run: python planos/descobrir.py ${{ inputs.alvos }}
      - name: Testar troca de praça
        if: always()
        run: python planos/descobrir_regiao.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: descoberta-planos
          path: planos/_descoberta
          retention-days: 7
